name = "streamforest"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# NOTE: Do NOT add a [triggers]/crons block here. Cloudflare Pages does not
# support cron triggers in wrangler.toml — it fails config validation and breaks
# EVERY deploy (regressed all deploys 2026-06-05 → 2026-06-12). The nightly M3U
# prefetch (_worker.ts `scheduled`) needs a separate standalone Worker with its
# own cron, or an external scheduler hitting a Pages endpoint.

[[d1_databases]]
binding = "DB"
database_name = "streamforest-profiles"
database_id = "1b607c87-bab2-485b-94c8-5722f9f8f9a6"

[[kv_namespaces]]
binding = "M3U_CACHE"
id = "5cc24082f8fc4da0baf49ebdcf23da86"
